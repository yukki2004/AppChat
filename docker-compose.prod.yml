# Override cho production — KHÔNG map port nào ra host (service app kết nối qua network nội bộ
# `chatapp-infra` bằng tên container, không qua localhost) + giới hạn tài nguyên + restart:always.
services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  mongo:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  rabbitmq:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
