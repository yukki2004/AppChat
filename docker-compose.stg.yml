# Override cho staging — vẫn mở port DB/broker để service (chạy trên server stg) kết nối, nhưng
# KHÔNG mở RabbitMQ management UI ra ngoài (chỉ truy cập qua SSH tunnel/VPN khi cần debug).
services:
  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  mongo:
    ports:
      - "${MONGO_PORT}:27017"

  redis:
    ports:
      - "${REDIS_PORT}:6379"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT}:5672"
