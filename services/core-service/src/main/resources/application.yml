server:
  port: 8090

spring:
  application:
    name: core-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CORE_DB_NAME:core_db}
    username: ${CORE_DB_USER:core_user}
    password: ${CORE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  cookie-domain: ${COOKIE_DOMAIN:}
  otp:
    mail-from: ${OTP_MAIL_FROM:no-reply@chatapp.com}
    code-ttl-seconds: ${OTP_CODE_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    lockout-seconds: ${OTP_LOCKOUT_SECONDS:1800}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  totp:
    secret-encryption-key: ${TOTP_SECRET_ENCRYPTION_KEY:}
    issuer: ${TOTP_ISSUER:ChatApp}
  geoip:
    mmdb-path: ${GEOIP_MMDB_PATH:./geoip/GeoLite2-City.mmdb}
  oauth:
    providers:
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:./keys/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public_key.pem}
  key-id: ${JWT_KEY_ID:core-dev-key-1}
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 2592000

logging:
  level:
    root: INFO
